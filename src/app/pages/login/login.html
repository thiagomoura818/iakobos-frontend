<app-header></app-header>
<div class="my-8 p-8 shadow rounded m-auto w-1/3 container bg-white">
    <h1 class="text-2xl font-medium">Bem-vindo de volta</h1>
    <h1 class="text-gray-400 text-sm">Entre para continuar seus estudos</h1>

    <form [formGroup]="loginForms" (ngSubmit)="onSubmit()" class="my-8">
        <app-forms-input-label labelName="E-mail" inputType="email" [control]="emailControl" placeHolder="seu@email.com"></app-forms-input-label>
        <app-forms-input-label labelName="Senha" inputType="password" [control]="passwordControl" placeHolder="********"></app-forms-input-label>
        <button type="submit" [disabled]="loginForms.invalid"
        class="w-full rounded-lg bg-black p-2 text-white transition-colors duration-200 hover:bg-gray-800">
        Entrar
        </button>
    </form>
    @if (errorMessage) {
      <p class="text-red-500 text-sm mt-2 text-center">{{ errorMessage }}</p>
    }
</div>
